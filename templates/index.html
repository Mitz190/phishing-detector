<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phishing Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-4xl font-bold text-center text-gray-800 mb-2">
                AI Phishing & Email Threat Detector
            </h1>
            <p class="text-center text-gray-600 mb-8">
                Paste a suspicious email and get an instant risk analysis with clear explanations
            </p>

            <div class="bg-white rounded-xl shadow-lg p-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Paste the full email content here
                </label>
                <textarea 
                    id="emailContent"
                    rows="12" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="From: ...
Subject: ...
Body: ..."></textarea>

                <button 
                    onclick="analyzeEmail()"
                    class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition">
                    Analyze Email
                </button>
            </div>

            <div id="result" class="mt-8 hidden"></div>
        </div>
    </div>

    <script>
        async function analyzeEmail() {
            const content = document.getElementById('emailContent').value;
            if (!content.trim()) {
                alert("Please paste an email first");
                return;
            }
            
            // We will connect this to the real API later
            document.getElementById('result').innerHTML = `
                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                    <p class="text-yellow-800">Analysis feature coming next...</p>
                </div>
            `;
            document.getElementById('result').classList.remove('hidden');
        }
    </script>
</body>
</html>
