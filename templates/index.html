<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Phishing Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-12">
    <div class="max-w-3xl mx-auto">
      <h1 class="text-4xl font-bold text-center text-gray-800 mb-2">
        AI Phishing &amp; Email Threat Detector
      </h1>
      <p class="text-center text-gray-600 mb-8">
        Paste a suspicious email and get an instant risk analysis with clear explanations
      </p>

      <div class="bg-white rounded-xl shadow-lg p-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Paste the full email content here
        </label>
        <textarea
          id="emailContent"
          rows="12"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="From: ...&#10;Subject: ...&#10;Body: ..."></textarea>

        <button
          onclick="analyzeEmail()"
          class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition">
          Analyze Email
        </button>
      </div>

      <div id="result" class="mt-8 hidden"></div>
    </div>
  </div>

  <script>
    async function analyzeEmail() {
      const content = document.getElementById('emailContent').value;
      if (!content.trim()) { alert("Please paste an email first"); return; }

      const box = document.getElementById('result');
      box.classList.remove('hidden');
      box.textContent = 'Analyzing...';

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        if (!res.ok) throw new Error('Server returned ' + res.status);
        const d = await res.json();

        const styles = {
          red:    { title: 'text-red-600',    border: 'border-red-400' },
          yellow: { title: 'text-yellow-600', border: 'border-yellow-400' },
          green:  { title: 'text-green-600',  border: 'border-green-400' }
        };
        const key = d.score >= 60 ? 'red' : d.score >= 30 ? 'yellow' : 'green';
        const s = styles[key];

        box.textContent = '';

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-lg p-6';

        const title = document.createElement('div');
        title.className = 'text-2xl font-bold ' + s.title;
        title.textContent = d.level + ' (' + d.score + '/100)';
        card.appendChild(title);
        if (d.explanation) {
            const ex = document.createElement('p');
            ex.className = 'mt-3 text-gray-700';
            ex.textContent = d.explanation;
            card.appendChild(ex);
        }

        const list = document.createElement('ul');
        list.className = 'mt-4 space-y-3';

        if (d.findings.length === 0) {
          const li = document.createElement('li');
          li.className = 'text-gray-600';
          li.textContent = 'No red flags found.';
          list.appendChild(li);
        }

        d.findings.forEach(f => {
          const li = document.createElement('li');
          li.className = 'border-l-4 pl-3 ' + s.border;

          const cat = document.createElement('div');
          cat.className = 'font-semibold';
          cat.textContent = f.category;

          const why = document.createElement('div');
          why.className = 'text-gray-600 text-sm';
          why.textContent = f.reason;

          li.appendChild(cat);
          li.appendChild(why);
          list.appendChild(li);
        });

        card.appendChild(list);
        box.appendChild(card);
      } catch (e) {
        box.textContent = 'Something went wrong. Check the terminal and the browser console (F12).';
        console.error(e);
      }
    }
  </script>
</body>
</html>
